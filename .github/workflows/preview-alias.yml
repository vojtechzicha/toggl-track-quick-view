# Points beta.track.zicha.dev at the newest successful Preview deployment from
# any branch. Production deployments are ignored.
#
# A stable origin keeps the password-gate session (localStorage, per origin)
# and an installed preview PWA working across deployments.
#
# Needs the VERCEL_TOKEN repo secret: a Vercel token for the zicha-dev team.
name: Alias preview domain

on:
  deployment_status:

permissions: {}

# Two deployments finishing together would race; the newest run wins.
concurrency:
  group: preview-alias
  cancel-in-progress: true

jobs:
  alias:
    if: >-
      github.event.deployment_status.state == 'success' &&
      startsWith(github.event.deployment.environment, 'Preview')
    runs-on: ubuntu-latest
    steps:
      - name: Alias beta.track.zicha.dev to this deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          URL: ${{ github.event.deployment_status.environment_url || github.event.deployment_status.target_url }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN secret is not set, so the preview domain cannot be aliased."
            exit 1
          fi
          echo "Aliasing $URL → beta.track.zicha.dev"
          npx --yes vercel@latest alias set "$URL" beta.track.zicha.dev \
            --token "$VERCEL_TOKEN" --scope zicha-dev
