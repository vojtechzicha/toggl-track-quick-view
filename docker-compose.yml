# Local MongoDB for `pnpm dev` / `pnpm db`, at mongodb://localhost:27018 (the
# commented-out MONGODB_URI in .env.tpl). Port 27018 so a MongoDB already on
# 27017 keeps working.
#
# No authentication: it holds throwaway data. That is only safe because the port
# is bound to 127.0.0.1; the short form "27018:27017" would bind 0.0.0.0 and
# expose an open database to the local network.
#
# No replica set needed: the app uses no transactions or change streams, and
# its one concurrency guarantee (at most one running timer) is a partial unique
# index.
services:
  mongo:
    image: mongo:8
    ports:
      - '127.0.0.1:27018:27017'
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  mongodata:
