allowBuilds:
  sharp: true

# `pdf-lib` is an alias for @cantoo/pdf-lib (see package.json), because
# @signpdf/placeholder-pdf-lib does `require('pdf-lib')`. With two copies, its
# `instanceof` checks and identity-keyed dictionary lookups would see a
# different set of PDF classes: the AcroForm would be recreated instead of
# extended and the signature widget would never reach the page.
#
# The fork is 2.x, which fails the placeholder's `pdf-lib@^1.17.1` peer range
# on version number only; this silences that warning.
peerDependencyRules:
  allowedVersions:
    '@signpdf/placeholder-pdf-lib>pdf-lib': '2'
