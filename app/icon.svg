<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Toggl Quick View">
  <rect width="64" height="64" rx="14" fill="#0d1117"/>
  <!-- progress ring track -->
  <circle cx="32" cy="32" r="18" fill="none" stroke="#2a3343" stroke-width="7"/>
  <!-- progress arc (~70%) -->
  <circle cx="32" cy="32" r="18" fill="none" stroke="#3b82f6" stroke-width="7"
          stroke-linecap="round" stroke-dasharray="79 114" transform="rotate(-90 32 32)"/>
  <!-- clock hands -->
  <g stroke="#e6edf3" stroke-width="3.5" stroke-linecap="round">
    <line x1="32" y1="32" x2="32" y2="22"/>
    <line x1="32" y1="32" x2="40" y2="36"/>
  </g>
  <circle cx="32" cy="32" r="2.6" fill="#e6edf3"/>
</svg>
